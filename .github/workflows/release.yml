name: Build & Release

on:
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ─── Determine the next semantic version from conventional commits ───
  version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          # Get latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Strip 'v' prefix
          CURRENT_VERSION="${LATEST_TAG#v}"

          # Parse semver components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Analyze commits since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" 2>/dev/null)
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null)
          fi

          echo "Commits since last tag:"
          echo "$COMMITS"

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          echo "Bump type: $BUMP"

          # Apply bump
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          BUILD_NUMBER=$(git rev-list --count HEAD)

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "✅ New version: ${NEW_VERSION}+${BUILD_NUMBER}"

  # ─── Build Android APK ───
  build-apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Update version in pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.new_version }}+${{ needs.version.outputs.build_number }}/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      # Set up release signing if secrets are configured
      - name: Set up keystore for release signing
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.new_version }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ExpenseTracker-v${{ needs.version.outputs.new_version }}-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/ExpenseTracker-v${{ needs.version.outputs.new_version }}-android.apk
          retention-days: 30

  # ─── Build Windows Installer ───
  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Update version in pubspec.yaml
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: ${{ needs.version.outputs.new_version }}+${{ needs.version.outputs.build_number }}" | Set-Content pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ needs.version.outputs.new_version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Create Windows Installer with Inno Setup
        shell: cmd
        run: |
          iscc /DAppVersion="${{ needs.version.outputs.new_version }}" installers\windows\inno_setup.iss

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/windows/Output/ExpenseTracker-v${{ needs.version.outputs.new_version }}-windows-setup.exe
          retention-days: 30

  # ─── Create GitHub Release ───
  release:
    needs: [version, build-apk, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts/

      - name: Download Windows Installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Generate release notes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION="v${{ needs.version.outputs.new_version }}"

          {
            echo "## What's Changed"
            echo ""

            if [ -n "$LATEST_TAG" ]; then
              git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Android  | \`ExpenseTracker-${VERSION}-android.apk\` |"
            echo "| Windows  | \`ExpenseTracker-${VERSION}-windows-setup.exe\` |"
            echo ""
            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...${VERSION}"
          } > release_notes.md

          cat release_notes.md

      - name: Update version in pubspec.yaml and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.version.outputs.new_version }}"
          BUILD="${{ needs.version.outputs.build_number }}"

          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml

          git add pubspec.yaml
          git diff --cached --quiet || git commit -m "chore: bump version to ${VERSION}+${BUILD} [skip ci]"

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          name: "Release v${{ needs.version.outputs.new_version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/ExpenseTracker-v${{ needs.version.outputs.new_version }}-android.apk
            artifacts/ExpenseTracker-v${{ needs.version.outputs.new_version }}-windows-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
