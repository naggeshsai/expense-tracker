name: expense_tracker
description: A complete cross-platform expense tracking application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  
  # Local Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.5
  
  # Charts & Visualization
  fl_chart: ^0.68.0
  
  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  connectivity_plus: ^6.0.3
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  drift_dev: ^2.15.0
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  
  # Testing
  bloc_test: ^9.1.6
  mocktail: ^1.0.3
  
  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
